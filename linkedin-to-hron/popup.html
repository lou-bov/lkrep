<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn → HR-ON</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 400px; margin: 0; padding: 12px; color: #1d1d1f; }
  body.page { width: auto; max-width: 720px; margin: 24px auto; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 12px 0 4px; }
  label { display: block; margin-top: 6px; font-weight: 600; font-size: 12px; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #c7c7cc; border-radius: 4px; font: inherit; }
  input[type=file] { border: 0; padding: 2px 0; }
  textarea { height: 50px; resize: vertical; }
  .row { display: flex; gap: 6px; }
  .row > div { flex: 1; }
  button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 5px; background: #0a66c2; color: #fff; font-weight: 600; cursor: pointer; }
  button.secondary { background: #e5e5ea; color: #1d1d1f; }
  button.small { width: auto; margin: 4px 4px 0 0; padding: 4px 8px; font-size: 12px; }
  .msg { margin-top: 8px; font-size: 12px; color: #555; }
  .cv { font-size: 12px; color: #2e7d32; margin-top: 4px; }
  .item { padding: 8px 0; border-bottom: 1px solid #eee; }
  .item .name { font-weight: 600; }
  .item .meta { color: #555; font-size: 12px; }
  .hidden { display: none; }
  .check { margin-bottom: 8px; padding: 8px; border-radius: 6px; background: #f2f2f7; font-size: 12px; }
  .check:empty { display: none; }
  .check.found { background: #fff4e5; color: #663c00; }
  .check.none { background: #e8f5e9; color: #1b5e20; }
  .check .match { margin-top: 4px; }
  #people { margin-bottom: 8px; }
  .people-list { max-height: 240px; overflow-y: auto; border: 1px solid #e5e5ea; border-radius: 6px; margin-top: 6px; }
  .person { display: flex; gap: 6px; align-items: flex-start; padding: 5px 6px; border-bottom: 1px solid #f2f2f7; }
  .person.current { background: #eef4fb; }
  .person input { width: auto; margin-top: 2px; }
  .person .who { flex: 1; min-width: 0; }
  .person .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; padding: 0 5px; border-radius: 8px; background: #e5e5ea; }
  .badge.in { background: #fff4e5; color: #663c00; }
  .badge.new { background: #e8f5e9; color: #1b5e20; }
  .row-buttons { display: flex; gap: 4px; }
  .tag-picker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; max-height: 110px; overflow-y: auto; }
  .chip { width: auto; margin: 0; padding: 2px 8px; border: 1px solid #c7c7cc; border-radius: 10px; background: #fff; color: #1d1d1f; font-weight: 400; font-size: 12px; }
  .chip.on { background: #0a66c2; border-color: #0a66c2; color: #fff; }
  .row-buttons button { flex: 1; }
  a { color: #0a66c2; }
</style>
</head>
<body>
  <h1>LinkedIn → HR-ON</h1>

  <section id="linkedin" class="hidden">
    <div id="people" class="hidden"></div>
    <div id="hronCheck" class="check"></div>
    <div class="row">
      <div><label for="firstName">First name</label><input id="firstName"></div>
      <div><label for="lastName">Last name</label><input id="lastName"></div>
    </div>
    <label for="email">Email</label><input id="email">
    <label for="phone">Mobile</label><input id="phone">
    <label for="headline">Title</label><input id="headline">
    <label for="company">Company</label><input id="company">
    <label for="location">Location</label><input id="location">
    <label for="linkedinUrl">LinkedIn URL</label><input id="linkedinUrl">

    <h2>HR-ON</h2>
    <label for="job">Job</label><input id="job" list="jobList" placeholder="Job posting title in HR-ON">
    <datalist id="jobList"></datalist>
    <label for="tags">Tags (comma-separated, or click below)</label><input id="tags">
    <div id="tagPicker" class="tag-picker"></div>
    <label for="notes">Note</label><textarea id="notes"></textarea>

    <h2>CV</h2>
    <div id="cvLinks"></div>
    <input type="file" id="cvFile" accept=".pdf,.doc,.docx,.rtf,.txt,.odt">
    <div class="cv" id="cvStatus"></div>

    <button id="addAndOpen">Add and open HR-ON</button>
    <button id="add" class="secondary">Add to queue</button>
  </section>

  <section id="hron" class="hidden">
    <p>1. On the job's applicant list, click <b>Fill form</b>, check the form and click <b>Save</b> in HR-ON.<br>
    2. Click <b>Add tags</b>.</p>
    <div class="cv" id="currentJob"></div>
  </section>

  <section id="queueSection" class="hidden">
    <h2>Queue</h2>
    <div id="queue"></div>
  </section>

  <section id="other" class="hidden">
    <p>Open a candidate profile in LinkedIn Recruiter, or open HR-ON to fill in candidates from the queue.</p>
  </section>

  <div class="msg" id="msg"></div>
  <div class="msg">
    <a href="popup.html?view=queue" target="_blank">Open queue in a tab</a> ·
    <a href="options.html" target="_blank">Settings</a>
  </div>

  <script src="extract.js"></script>
  <script src="cvtext.js"></script>
  <script src="hron.js"></script>
  <script src="popup.js"></script>
</body>
</html>
